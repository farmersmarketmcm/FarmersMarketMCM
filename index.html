<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Farmers Market Margo City – Tanya Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --green-deep:   #1a3c2b;
      --green-mid:    #2d6a4f;
      --green-bright: #40916c;
      --green-light:  #74c69d;
      --green-pale:   #d8f3dc;
      --green-mist:   #f0faf2;
      --cream:        #fefaf4;
      --brown:        #6b4f35;
      --text-dark:    #1a2118;
      --text-mid:     #3d5a47;
      --text-light:   #7a9982;
      --white:        #ffffff;
      --shadow:       0 4px 24px rgba(26,60,43,.12);
      --radius:       16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text-dark); }

    /* ── TOP BAR ── */
    header {
      background: var(--green-deep);
      display: flex; align-items: center; gap: 14px;
      padding: 14px 22px;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
      position: sticky; top: 0; z-index: 100;
    }
    .logo-circle {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--green-bright);
      display: grid; place-items: center;
      font-size: 22px; flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(116,198,157,.35);
    }
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--white); line-height: 1.2; }
    header p  { font-size: .73rem; color: var(--green-light); margin-top: 1px; letter-spacing:.3px; }
    .status-dot { width:9px; height:9px; border-radius:50%; background:#4ade80; margin-left:auto; box-shadow:0 0 8px #4ade80; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 6px #4ade80} 50%{box-shadow:0 0 16px #4ade80} }

    /* ── LAYOUT ── */
    .page { display: flex; flex-direction: column; height: 100dvh; }
    .chat-area {
      flex: 1; overflow-y: auto; padding: 20px 16px 10px;
      display: flex; flex-direction: column; gap: 14px;
      background: var(--green-mist);
      background-image: radial-gradient(circle at 20% 20%, rgba(64,145,108,.08) 0%, transparent 60%),
                        radial-gradient(circle at 80% 80%, rgba(45,106,79,.07) 0%, transparent 60%);
    }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--green-light); border-radius: 4px; }

    /* ── BUBBLES ── */
    .bubble-wrap { display: flex; gap: 10px; align-items: flex-end; max-width: 82%; animation: fadeUp .35s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .bubble-wrap.bot  { align-self: flex-start; }
    .bubble-wrap.user { align-self: flex-end; flex-direction: row-reverse; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center; font-size: 15px;
    }
    .avatar.bot-av  { background: var(--green-mid); }
    .avatar.user-av { background: var(--green-bright); }
    .bubble {
      padding: 11px 16px; border-radius: 18px; font-size: .88rem; line-height: 1.6;
      max-width: 100%; word-break: break-word;
    }
    .bubble.bot  { background: var(--white); color: var(--text-dark); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }
    .bubble.user { background: var(--green-mid); color: var(--white); border-bottom-right-radius: 4px; }
    .bubble .lorong-badge {
      display: inline-block; margin-top: 6px; padding: 3px 10px;
      background: var(--green-pale); color: var(--green-deep);
      border-radius: 20px; font-size: .75rem; font-weight: 600;
    }
    .bubble .not-found { color: var(--brown); font-style: italic; font-size: .84rem; }
    .timestamp { font-size: .65rem; color: var(--text-light); margin-top: 3px; padding: 0 6px; }
    .bubble-wrap.user .timestamp { text-align: right; }

    /* ── QUICK CHIPS ── */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 16px 0; }
    .chip {
      padding: 6px 14px; border-radius: 20px; font-size: .78rem; font-weight: 500;
      border: 1.5px solid var(--green-bright); color: var(--green-mid);
      cursor: pointer; transition: .2s; background: var(--white);
    }
    .chip:hover { background: var(--green-bright); color: var(--white); }

    /* ── INPUT BAR ── */
    .input-bar {
      padding: 12px 16px 16px;
      background: var(--white);
      border-top: 1px solid rgba(64,145,108,.15);
      display: flex; gap: 10px; align-items: flex-end;
    }
    textarea {
      flex: 1; resize: none; border: 1.5px solid rgba(64,145,108,.3);
      border-radius: 12px; padding: 10px 14px; font-size: .88rem;
      font-family: 'DM Sans', sans-serif; color: var(--text-dark);
      background: var(--green-mist); outline: none; max-height: 120px;
      transition: border-color .2s;
    }
    textarea:focus { border-color: var(--green-bright); }
    textarea::placeholder { color: var(--text-light); }
    button.send-btn {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--green-mid); border: none; cursor: pointer;
      display: grid; place-items: center; flex-shrink: 0;
      transition: background .2s, transform .1s;
    }
    button.send-btn:hover  { background: var(--green-deep); }
    button.send-btn:active { transform: scale(.95); }
    button.send-btn svg { width: 20px; height: 20px; fill: white; }

    /* ── TYPING INDICATOR ── */
    .typing { display: flex; gap: 5px; padding: 10px 14px; align-items: center; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--green-light);
      animation: bounce .9s ease infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-7px)} }

    /* ── ADMIN BADGE ── */
    .bubble.admin-reply { background: #fff8e1; border-left: 3px solid #f59e0b; }
    .bubble.admin-reply::before { content: '👨‍💼 Admin: '; font-weight: 600; color: #92400e; font-size:.78rem; display:block; margin-bottom:4px; }
  </style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <header>
    <div class="logo-circle">🥬</div>
    <div>
      <h1>Farmers Market Margo City</h1>
      <p>Tanya lokasi produk & lorong kami</p>
    </div>
    <div class="status-dot" title="Bot aktif"></div>
  </header>

  <!-- CHAT -->
  <div class="chat-area" id="chatArea">
    <!-- Selamat datang -->
    <div class="bubble-wrap bot">
      <div class="avatar bot-av">🌿</div>
      <div>
        <div class="bubble bot">
          Halo! Selamat datang di <strong>Farmers Market Margo City</strong> 👋<br>
          Saya bisa bantu kamu menemukan produk & lorongnya. Ketik nama produk yang kamu cari, ya!
        </div>
        <div class="timestamp" id="welcomeTime"></div>
      </div>
    </div>
  </div>

  <!-- QUICK CHIPS -->
  <div class="chips" id="chips">
    <div class="chip" onclick="sendChip(this)">🥕 Sayuran</div>
    <div class="chip" onclick="sendChip(this)">🍓 Buah Segar</div>
    <div class="chip" onclick="sendChip(this)">🥩 Daging & Ikan</div>
    <div class="chip" onclick="sendChip(this)">🧃 Minuman Segar</div>
    <div class="chip" onclick="sendChip(this)">🧀 Produk Olahan</div>
  </div>

  <!-- INPUT -->
  <div class="input-bar">
    <textarea id="userInput" placeholder="Ketik nama produk…" rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
// ──────────────────────────────────────────────
//  DATA PRODUK – Edit file products.json lalu
//  upload ke folder yang sama dengan index.html
// ──────────────────────────────────────────────
let products = [];

async function loadProducts() {
  try {
    const r = await fetch('products.json');
    products = await r.json();
  } catch(e) {
    products = []; // jika belum ada file
  }
}

// ──────────────────────────────────────────────
//  SESSION ID (untuk sinkronisasi admin)
// ──────────────────────────────────────────────
const SESSION_ID = 'cust_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
let messageCount = 0;

function saveSession(role, text) {
  let sessions = JSON.parse(localStorage.getItem('fm_sessions') || '{}');
  if (!sessions[SESSION_ID]) {
    sessions[SESSION_ID] = { id: SESSION_ID, started: Date.now(), messages: [], userAgent: navigator.userAgent };
  }
  sessions[SESSION_ID].messages.push({ role, text, time: Date.now() });
  sessions[SESSION_ID].lastActive = Date.now();
  localStorage.setItem('fm_sessions', JSON.stringify(sessions));

  // Statistik global
  let stats = JSON.parse(localStorage.getItem('fm_stats') || '{"total":0,"today":0,"lastDate":""}');
  const today = new Date().toDateString();
  if (stats.lastDate !== today) { stats.today = 0; stats.lastDate = today; }
  stats.total++;
  stats.today++;
  localStorage.setItem('fm_stats', JSON.stringify(stats));
}

// ──────────────────────────────────────────────
//  PENCARIAN PRODUK
// ──────────────────────────────────────────────
function searchProduct(query) {
  const q = query.toLowerCase().trim();
  const found = products.filter(p =>
    p.nama.toLowerCase().includes(q) ||
    (p.kategori || '').toLowerCase().includes(q) ||
    (p.alias || []).some(a => a.toLowerCase().includes(q))
  );
  return found;
}

// ──────────────────────────────────────────────
//  BOT REPLY via Claude API
// ──────────────────────────────────────────────
async function getBotReply(userMsg) {
  const found = searchProduct(userMsg);

  // Jika ada produk cocok, jawab langsung tanpa API
  if (found.length > 0) {
    const list = found.slice(0,5).map(p =>
      `• <strong>${p.nama}</strong> → <span class="lorong-badge">📍 ${p.lorong}</span>${p.keterangan ? '<br><span style="font-size:.78rem;color:#3d5a47">'+p.keterangan+'</span>' : ''}`
    ).join('<br>');
    return `Saya menemukan <strong>${found.length}</strong> produk untuk "<em>${userMsg}</em>":<br><br>${list}`;
  }

  // Tanya Claude jika tidak ditemukan di data
  try {
    const productList = products.slice(0,60).map(p => `${p.nama} (${p.lorong})`).join(', ');
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 300,
        system: `Kamu adalah asisten Farmers Market Margo City. Daftar produk tersedia: ${productList}. 
Jika customer bertanya produk yang tidak ada di daftar, sarankan produk serupa yang ada, atau minta mereka hubungi admin. 
Jawab singkat dalam Bahasa Indonesia. Jangan sebut kamu AI.`,
        messages: [{ role: 'user', content: userMsg }]
      })
    });
    const data = await resp.json();
    return data.content?.[0]?.text || fallback(userMsg);
  } catch(e) {
    return fallback(userMsg);
  }
}

function fallback(q) {
  return `<span class="not-found">Maaf, produk "<em>${q}</em>" belum ada dalam database kami. 
Silakan hubungi admin atau coba kata kunci lain. 
Kami terus memperbarui daftar produk! 🌱</span>`;
}

// ──────────────────────────────────────────────
//  UI HELPERS
// ──────────────────────────────────────────────
function nowTime() {
  return new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
}

function addBubble(role, html, isHtml = false) {
  const area = document.getElementById('chatArea');
  const wrap = document.createElement('div');
  wrap.className = `bubble-wrap ${role}`;
  const icon = role === 'bot' ? '🌿' : '👤';
  const avClass = role === 'bot' ? 'bot-av' : 'user-av';
  wrap.innerHTML = `
    <div class="avatar ${avClass}">${icon}</div>
    <div>
      <div class="bubble ${role}">${isHtml ? html : escHtml(html)}</div>
      <div class="timestamp">${nowTime()}</div>
    </div>`;
  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;
  return wrap;
}

function addAdminBubble(html) {
  const area = document.getElementById('chatArea');
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap bot';
  wrap.innerHTML = `
    <div class="avatar bot-av">👨‍💼</div>
    <div>
      <div class="bubble bot admin-reply">${escHtml(html)}</div>
      <div class="timestamp">${nowTime()}</div>
    </div>`;
  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showTyping() {
  const area = document.getElementById('chatArea');
  const el = document.createElement('div');
  el.className = 'bubble-wrap bot'; el.id = 'typing';
  el.innerHTML = `<div class="avatar bot-av">🌿</div>
    <div class="bubble bot typing"><span></span><span></span><span></span></div>`;
  area.appendChild(el); area.scrollTop = area.scrollHeight;
}
function hideTyping() { document.getElementById('typing')?.remove(); }

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function sendMessage() {
  const ta = document.getElementById('userInput');
  const msg = ta.value.trim();
  if (!msg) return;
  ta.value = ''; ta.style.height = 'auto';
  document.getElementById('chips').style.display = 'none';

  addBubble('user', msg);
  saveSession('user', msg);
  messageCount++;

  showTyping();
  await new Promise(r => setTimeout(r, 600 + Math.random()*600));
  hideTyping();

  const reply = await getBotReply(msg);
  addBubble('bot', reply, true);
  saveSession('bot', reply);
}

function sendChip(el) {
  document.getElementById('userInput').value = el.textContent.replace(/^[^\s]+\s/,'');
  sendMessage();
}

// Polling admin reply
function checkAdminReplies() {
  const sessions = JSON.parse(localStorage.getItem('fm_sessions') || '{}');
  const sess = sessions[SESSION_ID];
  if (!sess) return;
  const pending = sess.messages.filter(m => m.role === 'admin' && !m.shown);
  pending.forEach(m => { addAdminBubble(m.text); m.shown = true; });
  if (pending.length) {
    sessions[SESSION_ID] = sess;
    localStorage.setItem('fm_sessions', JSON.stringify(sessions));
  }
}

// ── INIT ──
document.getElementById('welcomeTime').textContent = nowTime();
loadProducts();
setInterval(checkAdminReplies, 3000);
saveSession('system', 'session_start');
</script>
</body>
</html>
